[package]
name = "bench-axum-tls"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
# rustls with the `ring` provider: the same TLS library and the same
# cryptography as giong-tls, so the comparison is about the runtime.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
